<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vorrats-Tracker" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <title>Kellerbestand & Vorrats-Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
    }
    button, label, select, input {
      touch-action: manipulation;
      cursor: pointer;
    }
    .safe-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col bg-slate-50 shadow-sm">
    <!-- Pull-to-Refresh Indicator -->
    <div id="ptr-indicator" class="hidden bg-emerald-600 text-white text-xs font-semibold text-center py-2 px-4 transition-all">
      ↓ Zum Aktualisieren ziehen…
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>🫙</span>
          <span>Keller & Vorrat</span>
        </h1>
        <p id="header-subtitle" class="text-xs text-slate-500 flex items-center gap-1.5">
          <span>Kategorien → Sorten → MHD</span>
          <span id="storage-badge" class="inline-flex items-center gap-0.5 text-[10px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded-md">🛡️ Gesichert</span>
        </p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-open-add" onclick="openItemModal({ mode: 'new' })" type="button" class="bg-emerald-600 active:bg-emerald-700 text-white text-sm font-semibold px-3 py-2 rounded-xl shadow-sm flex items-center gap-1">
          <span>＋</span>
          <span>Neu</span>
        </button>
        <button id="btn-reload-app" onclick="pullToRefreshReload()" type="button" aria-label="Neu laden" title="Seite neu laden" class="p-2 rounded-xl border border-slate-200 bg-white active:bg-slate-100 text-slate-700 text-sm">
          🔄
        </button>
        <button id="btn-open-settings" onclick="openSettingsModal()" type="button" aria-label="Einstellungen" class="p-2 rounded-xl border border-slate-200 bg-white active:bg-slate-100 text-slate-700">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-4 space-y-4 safe-bottom">
      <!-- Diagnostic / Error Banner -->
      <div id="js-error-banner" class="hidden rounded-2xl border border-rose-400 bg-rose-100 text-rose-950 p-3 text-xs font-mono"></div>

      <!-- Recovery Info Banner -->
      <div id="recovery-banner" class="hidden rounded-2xl border border-emerald-300 bg-emerald-50 text-emerald-950 p-3 text-xs font-medium"></div>

      <!-- Expiration Alert Banner -->
      <div id="alert-banner" class="hidden rounded-2xl border p-3.5 text-sm"></div>

      <!-- Status Summary Cards -->
      <section class="grid grid-cols-3 gap-2.5">
        <button data-filter-status="expired" onclick="toggleStatusFilter('expired')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-rose-200 active:border-rose-400">
          <div class="text-xs font-medium text-rose-600">Abgelaufen</div>
          <div id="count-expired" class="text-2xl font-bold text-rose-700 mt-0.5">0</div>
        </button>
        <button data-filter-status="soon" onclick="toggleStatusFilter('soon')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-amber-200 active:border-amber-400">
          <div class="text-xs font-medium text-amber-600">Bald fällig (≤7T)</div>
          <div id="count-soon" class="text-2xl font-bold text-amber-700 mt-0.5">0</div>
        </button>
        <button data-filter-status="ok" onclick="toggleStatusFilter('ok')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-emerald-200 active:border-emerald-400">
          <div class="text-xs font-medium text-emerald-600">Im Bestand</div>
          <div id="count-ok" class="text-2xl font-bold text-emerald-700 mt-0.5">0</div>
        </button>
      </section>

      <!-- Search & Collapse Controls -->
      <section class="bg-white rounded-2xl p-3 border border-slate-200 flex gap-2 items-center">
        <div class="relative flex-1">
          <input id="search-input" oninput="handleSearchInput(this.value)" type="search" placeholder="Produkt, Sorte oder Marke suchen..." class="w-full rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
        </div>
        <button onclick="collapseAllFolders()" type="button" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 active:bg-slate-100 text-xs font-semibold text-slate-700 whitespace-nowrap" title="Alle Reiter zuklappen">
          Alle zu
        </button>
      </section>

      <!-- 3-Level Accordion Inventory Container -->
      <section id="inventory-container" class="space-y-2.5"></section>
    </main>
  </div>

  <!-- Add / Edit Item Modal -->
  <div id="modal-item" class="fixed inset-0 z-40 hidden bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 id="modal-item-title" class="text-lg font-bold text-slate-900">Produkt einlagern</h2>
        <button onclick="closeItemModal()" type="button" class="w-9 h-9 rounded-full bg-slate-100 active:bg-slate-200 text-slate-600 flex items-center justify-center font-bold">✕</button>
      </div>

      <!-- Barcode Scanner Box -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
            <span>📷</span>
            <span>Barcode-Scanner</span>
          </span>
          <button id="btn-toggle-scanner" onclick="toggleScanner()" type="button" class="text-xs font-semibold bg-slate-900 active:bg-slate-800 text-white px-3 py-1.5 rounded-lg">
            Kamera starten
          </button>
        </div>
        <div id="scanner-status" class="text-xs text-slate-500">Scanne den Strichcode auf der Verpackung oder fülle die Felder direkt aus.</div>
        <div id="qr-reader" class="hidden rounded-xl overflow-hidden border border-slate-300 bg-black"></div>
      </div>

      <!-- Quick Preset Selector for Known Varieties in Category -->
      <div id="known-presets-box" class="hidden bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3 space-y-1.5">
        <label for="preset-select" class="block text-xs font-semibold text-emerald-900">
          ⚡ Bekannte Sorte in dieser Kategorie übernehmen
        </label>
        <select id="preset-select" onchange="applyPresetSelection(this.value)" class="w-full rounded-xl border border-emerald-300 bg-white px-3 py-2 text-sm text-slate-800">
          <option value="">-- Neue Sorte / neues Produkt eingeben --</option>
        </select>
      </div>
