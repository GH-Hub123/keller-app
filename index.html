<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vorrats-Tracker" />
  <meta name="theme-color" content="#16a34a" />
  <title>Kellerbestand & Vorrats-Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
    }
    button, label, select, input {
      touch-action: manipulation;
      cursor: pointer;
    }
    .safe-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col bg-slate-50 shadow-sm">
    <!-- Header -->
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>🫙</span>
          <span>Keller & Vorrat</span>
        </h1>
        <p id="header-subtitle" class="text-xs text-slate-500">Lokal gespeichert • Bereit</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-open-add" onclick="openItemModal({ mode: 'new' })" type="button" class="bg-emerald-600 active:bg-emerald-700 text-white text-sm font-semibold px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5">
          <span>＋</span>
          <span>Neu</span>
        </button>
        <button id="btn-open-settings" onclick="openSettingsModal()" type="button" aria-label="Einstellungen" class="p-2 rounded-xl border border-slate-200 bg-white active:bg-slate-100 text-slate-700">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-4 space-y-4 safe-bottom">
      <!-- Diagnostic / Error Banner -->
      <div id="js-error-banner" class="hidden rounded-2xl border border-rose-400 bg-rose-100 text-rose-950 p-3 text-xs font-mono"></div>

      <!-- Expiration Alert Banner -->
      <div id="alert-banner" class="hidden rounded-2xl border p-3.5 text-sm"></div>

      <!-- Status Summary Cards -->
      <section class="grid grid-cols-3 gap-2.5">
        <button data-filter-status="expired" onclick="toggleStatusFilter('expired')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-rose-200 active:border-rose-400">
          <div class="text-xs font-medium text-rose-600">Abgelaufen</div>
          <div id="count-expired" class="text-2xl font-bold text-rose-700 mt-0.5">0</div>
        </button>
        <button data-filter-status="soon" onclick="toggleStatusFilter('soon')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-amber-200 active:border-amber-400">
          <div class="text-xs font-medium text-amber-600">Bald fällig (≤7T)</div>
          <div id="count-soon" class="text-2xl font-bold text-amber-700 mt-0.5">0</div>
        </button>
        <button data-filter-status="ok" onclick="toggleStatusFilter('ok')" type="button" class="status-card text-left bg-white rounded-2xl p-3 border border-emerald-200 active:border-emerald-400">
          <div class="text-xs font-medium text-emerald-600">Im Bestand</div>
          <div id="count-ok" class="text-2xl font-bold text-emerald-700 mt-0.5">0</div>
        </button>
      </section>

      <!-- Search & View Mode Controls -->
      <section class="bg-white rounded-2xl p-3 border border-slate-200 space-y-2.5">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <input id="search-input" oninput="handleSearchInput(this.value)" type="search" placeholder="Produkt, Sorte oder Marke suchen..." class="w-full rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-3 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
          </div>
          <button id="btn-group-toggle" onclick="toggleGroupMode()" type="button" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 active:bg-slate-100 text-xs font-semibold text-slate-700 whitespace-nowrap">
            Sort: MHD
          </button>
        </div>

        <!-- Category Filter Chips -->
        <div id="category-filters" class="flex gap-1.5 overflow-x-auto pb-1"></div>
      </section>

      <!-- Inventory List -->
      <section id="inventory-container" class="space-y-3"></section>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div id="modal-item" class="fixed inset-0 z-40 hidden bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 id="modal-item-title" class="text-lg font-bold text-slate-900">Produkt einlagern</h2>
        <button onclick="closeItemModal()" type="button" class="w-9 h-9 rounded-full bg-slate-100 active:bg-slate-200 text-slate-600 flex items-center justify-center font-bold">✕</button>
      </div>

      <!-- Barcode Scanner Box -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
            <span>📷</span>
            <span>Barcode-Scanner</span>
          </span>
          <button id="btn-toggle-scanner" onclick="toggleScanner()" type="button" class="text-xs font-semibold bg-slate-900 active:bg-slate-800 text-white px-3 py-1.5 rounded-lg">
            Kamera starten
          </button>
        </div>
        <div id="scanner-status" class="text-xs text-slate-500">Scanne den Strichcode auf der Verpackung oder fülle die Felder direkt aus.</div>
        <div id="qr-reader" class="hidden rounded-xl overflow-hidden border border-slate-300 bg-black"></div>
      </div>

      <!-- Quick Preset Selector for Known Varieties in Category -->
      <div id="known-presets-box" class="hidden bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3 space-y-1.5">
        <label for="preset-select" class="block text-xs font-semibold text-emerald-900">
          ⚡ Bekannte Sorte in dieser Kategorie übernehmen
        </label>
        <select id="preset-select" onchange="applyPresetSelection(this.value)" class="w-full rounded-xl border border-emerald-300 bg-white px-3 py-2 text-sm text-slate-800">
          <option value="">-- Neue Sorte / neues Produkt eingeben --</option>
        </select>
      </div>

      <form id="item-form" onsubmit="submitItemForm(event)" class="space-y-3">
        <input type="hidden" id="item-id" />
        <input type="hidden" id="item-barcode" />

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="item-category" class="block text-xs font-semibold text-slate-700 mb-1">Kategorie *</label>
            <select id="item-category" onchange="populatePresetDropdown(this.value)" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm"></select>
          </div>
          <div>
            <label for="item-expiry" class="block text-xs font-semibold text-slate-700 mb-1">Mindesthaltbarkeit (MHD) *</label>
            <input id="item-expiry" type="date" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm" />
          </div>
        </div>

        <div>
          <label for="item-name" class="block text-xs font-semibold text-slate-700 mb-1">Produkt / Sorte *</label>
          <input id="item-name" type="text" required placeholder="z. B. Spaghetti Nr. 5, Penne Rigate, Oregano..." class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="item-brand" class="block text-xs font-semibold text-slate-700 mb-1">Hersteller / Variante</label>
            <input id="item-brand" type="text" placeholder="z. B. Barilla, Bio, 500g" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm" />
          </div>
          <div>
            <label for="item-quantity" class="block text-xs font-semibold text-slate-700 mb-1">Anzahl Packungen</label>
            <input id="item-quantity" type="number" min="1" step="1" value="1" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm" />
          </div>
        </div>

        <div>
          <label for="item-notes" class="block text-xs font-semibold text-slate-700 mb-1">Lagerort / Notiz (optional)</label>
          <input id="item-notes" type="text" placeholder="z. B. Regal links oben, Keller Fach 2" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm" />
        </div>

        <div class="pt-2 flex gap-2.5">
          <button type="button" onclick="closeItemModal()" class="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm active:bg-slate-50">
            Abbrechen
          </button>
          <button type="submit" class="flex-1 py-2.5 px-5 rounded-xl bg-emerald-600 active:bg-emerald-700 text-white font-semibold text-sm shadow-sm">
            Speichern
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings / Backup Modal -->
  <div id="modal-settings" class="fixed inset-0 z-40 hidden bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-lg font-bold text-slate-900">Einstellungen & Backup</h2>
        <button onclick="closeSettingsModal()" type="button" class="w-9 h-9 rounded-full bg-slate-100 active:bg-slate-200 text-slate-600 flex items-center justify-center font-bold">✕</button>
      </div>

      <div class="space-y-2">
        <label for="warning-days-input" class="block text-xs font-semibold text-slate-700">
          „Bald fällig“-Warnung wie viele Tage vor Ablauf?
        </label>
        <input id="warning-days-input" type="number" min="1" max="90" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
      </div>

      <div class="space-y-2 pt-1">
        <div class="text-xs font-semibold text-slate-700">Datensicherung (JSON Backup)</div>
        <div class="flex gap-2">
          <button onclick="exportBackupJSON()" type="button" class="flex-1 py-2.5 px-3 rounded-xl border border-slate-300 active:bg-slate-50 text-xs font-semibold text-slate-800">
            ⬇️ Backup exportieren
          </button>
          <label class="flex-1 py-2.5 px-3 rounded-xl border border-slate-300 active:bg-slate-50 text-xs font-semibold text-slate-800 text-center">
            ⬆️ Backup laden
            <input onchange="importBackupJSON(event)" type="file" accept="application/json" class="hidden" />
          </label>
        </div>
      </div>

      <div class="flex items-center justify-between pt-3 border-t border-slate-100">
        <button onclick="clearAllData()" type="button" class="text-xs font-semibold text-rose-600">
          Alle Daten leeren
        </button>
        <button onclick="saveSettings()" type="button" class="bg-slate-900 active:bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl">
          Speichern
        </button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" async></script>

  <script>
    window.onerror = function (msg, _url, line) {
      var banner = document.getElementById('js-error-banner');
      if (banner) {
        banner.classList.remove('hidden');
        banner.textContent = 'Hinweis (Zeile ' + line + '): ' + msg;
      }
    };

    var CATEGORIES = [
      { id: 'nudeln-reis', label: 'Nudeln & Reis', icon: '🍝' },
      { id: 'kraeuter-gewuerze', label: 'Kräuter & Gewürze', icon: '🌿' },
      { id: 'konserven', label: 'Konserven', icon: '🥫' },
      { id: 'sossen-oele', label: 'Soßen & Öle', icon: '🫙' },
      { id: 'getraenke', label: 'Getränke', icon: '🥤' },
      { id: 'suesse-snacks', label: 'Süßes & Snacks', icon: '🍫' },
      { id: 'sonstiges', label: 'Sonstiges', icon: '📦' }
    ];

    var CalendarReminderHook = {
      onItemSaved: function () {},
      onItemExpired: function () {}
    };

    var STORAGE_KEY = 'keller_vorrat_v1';
    var LocalStorageAdapter = {
      load: function () {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (err) {
          return null;
        }
      },
      save: function (data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (err) {}
      }
    };

    function daysFromNowISO(offsetDays) {
      var d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().slice(0, 10);
    }

    function createDefaultState() {
      return {
        settings: {
          warningDays: 7,
          groupByCategory: false
        },
        items: []
      };
    }

    var state = LocalStorageAdapter.load() || createDefaultState();
    var activeCategory = 'all';
    var activeStatusFilter = 'all';
    var searchQuery = '';
    var html5QrCode = null;
    var isScanning = false;

    function persist() {
      LocalStorageAdapter.save(state);
    }

    function getDaysUntil(dateStr) {
      if (!dateStr) return 9999;
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var parts = dateStr.split('-');
      if (parts.length !== 3) return 9999;
      var target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getItemStatus(item) {
      var days = getDaysUntil(item.expiryDate);
      if (days < 0) return 'expired';
      if (days <= (state.settings.warningDays || 7)) return 'soon';
      return 'ok';
    }

    function formatDateDE(dateStr) {
      if (!dateStr) return '-';
      var parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return parts[2] + '.' + parts[1] + '.' + parts[0];
    }

    function getCategoryMeta(catId) {
      for (var i = 0; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].id === catId) return CATEGORIES[i];
      }
      return { id: 'sonstiges', label: 'Sonstiges', icon: '📦' };
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function getKnownVarietiesForCategory(catId) {
      var seen = {};
      var list = [];
      for (var i = 0; i < state.items.length; i++) {
        var it = state.items[i];
        if (it.category !== catId) continue;
        var key = it.name.trim().toLowerCase() + '||' + (it.brand || '').trim().toLowerCase();
        if (!seen[key]) {
          seen[key] = true;
          list.push({
            name: it.name,
            brand: it.brand || '',
            barcode: it.barcode || '',
            notes: it.notes || ''
          });
        }
      }
      return list;
    }

    function populatePresetDropdown(catId) {
      var box = document.getElementById('known-presets-box');
      var select = document.getElementById('preset-select');
      var presets = getKnownVarietiesForCategory(catId);

      select.innerHTML = '<option value="">-- Neue Sorte / neues Produkt eingeben --</option>';
      if (presets.length === 0) {
        box.classList.add('hidden');
        return;
      }

      for (var i = 0; i < presets.length; i++) {
        var p = presets[i];
        var opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = p.brand ? p.name + ' (' + p.brand + ')' : p.name;
        select.appendChild(opt);
      }
      box.classList.remove('hidden');
    }

    function applyPresetSelection(val) {
      if (val === '') return;
      var idx = Number(val);
      var catId = document.getElementById('item-category').value;
      var presets = getKnownVarietiesForCategory(catId);
      var chosen = presets[idx];
      if (chosen) {
        document.getElementById('item-name').value = chosen.name;
        document.getElementById('item-brand').value = chosen.brand;
        document.getElementById('item-notes').value = chosen.notes;
        document.getElementById('item-barcode').value = chosen.barcode;
      }
    }

    function selectCategoryFilter(catId) {
      activeCategory = catId;
      render();
    }

    function toggleStatusFilter(st) {
      activeStatusFilter = activeStatusFilter === st ? 'all' : st;
      render();
    }

    function handleSearchInput(val) {
      searchQuery = val;
      render();
    }

    function toggleGroupMode() {
      state.settings.groupByCategory = !state.settings.groupByCategory;
      persist();
      render();
    }

    function render() {
      var expiredItems = [];
      var soonItems = [];
      var okItems = [];
      var expiredQty = 0;
      var soonQty = 0;
      var okQty = 0;

      for (var i = 0; i < state.items.length; i++) {
        var it = state.items[i];
        var st = getItemStatus(it);
        if (st === 'expired') {
          expiredItems.push(it);
          expiredQty += it.quantity;
        } else if (st === 'soon') {
          soonItems.push(it);
          soonQty += it.quantity;
        } else {
          okItems.push(it);
          okQty += it.quantity;
        }
      }

      document.getElementById('count-expired').textContent = String(expiredQty);
      document.getElementById('count-soon').textContent = String(soonQty);
      document.getElementById('count-ok').textContent = String(okQty);

      var banner = document.getElementById('alert-banner');
      if (expiredItems.length > 0 || soonItems.length > 0) {
        banner.classList.remove('hidden');
        if (expiredItems.length > 0) {
          banner.className = 'rounded-2xl border border-rose-300 bg-rose-50 text-rose-900 p-3.5 text-sm';
          var names = expiredItems.slice(0, 3).map(function (x) { return x.name; }).join(', ');
          banner.innerHTML =
            '<div class="font-bold">🚨 ' + expiredItems.length + ' Eintrag/Einträge über dem MHD!</div>' +
            '<div class="text-xs mt-1 text-rose-800">' + escapeHTML(names) + (expiredItems.length > 3 ? ' u. a.' : '') + ' – bitte prüfen oder ausbuchen.</div>';
        } else {
          banner.className = 'rounded-2xl border border-amber-300 bg-amber-50 text-amber-900 p-3.5 text-sm';
          banner.innerHTML =
            '<div class="font-bold">⏳ ' + soonItems.length + ' Produkt(e) laufen bald ab</div>' +
            '<div class="text-xs mt-1 text-amber-800">Innerhalb der nächsten ' + (state.settings.warningDays || 7) + ' Tage fällig.</div>';
        }
      } else {
        banner.classList.add('hidden');
      }

      var cards = document.querySelectorAll('.status-card');
      for (var c = 0; c < cards.length; c++) {
        var cardSt = cards[c].getAttribute('data-filter-status');
        var isAct = activeStatusFilter === cardSt;
        cards[c].classList.toggle('ring-2', isAct);
        cards[c].classList.toggle('ring-slate-800', isAct);
      }

      var catContainer = document.getElementById('category-filters');
      var chipsHTML = createFilterChipHTML('all', 'Alle', '📋', activeCategory === 'all');
      for (var k = 0; k < CATEGORIES.length; k++) {
        var cat = CATEGORIES[k];
        chipsHTML += createFilterChipHTML(cat.id, cat.label, cat.icon, activeCategory === cat.id);
      }
      catContainer.innerHTML = chipsHTML;

      document.getElementById('btn-group-toggle').textContent = state.settings.groupByCategory ? 'Sort: Kategorie' : 'Sort: MHD';

      var q = searchQuery.trim().toLowerCase();
      var filtered = state.items.filter(function (item) {
        if (activeCategory !== 'all' && item.category !== activeCategory) return false;
        if (activeStatusFilter !== 'all' && getItemStatus(item) !== activeStatusFilter) return false;
        if (q) {
          var catLabel = getCategoryMeta(item.category).label.toLowerCase();
          var hay = (item.name + ' ' + (item.brand || '') + ' ' + (item.notes || '') + ' ' + catLabel).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      filtered.sort(function (a, b) {
        return getDaysUntil(a.expiryDate) - getDaysUntil(b.expiryDate);
      });

      var listContainer = document.getElementById('inventory-container');
      if (filtered.length === 0) {
        listContainer.innerHTML =
          '<div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center space-y-2">' +
          '<div class="text-3xl">🫙</div>' +
          '<div class="font-semibold text-slate-800 text-sm">Noch keine Vorräte eingetragen</div>' +
          '<p class="text-xs text-slate-500">Tippe oben auf „＋ Neu“, um dein erstes Produkt einzuscannen oder manuell einzutragen.</p>' +
          '</div>';
        return;
      }

      if (state.settings.groupByCategory) {
        var groups = {};
        var groupOrder = [];
        for (var f = 0; f < filtered.length; f++) {
          var item = filtered[f];
          if (!groups[item.category]) {
            groups[item.category] = [];
            groupOrder.push(item.category);
          }
          groups[item.category].push(item);
        }

        var groupedHTML = '';
        for (var g = 0; g < groupOrder.length; g++) {
          var cid = groupOrder[g];
          var meta = getCategoryMeta(cid);
          var list = groups[cid];
          var totalQty = list.reduce(function (s, x) { return s + x.quantity; }, 0);
          groupedHTML +=
            '<div class="space-y-2">' +
            '<div class="flex items-center justify-between px-1 pt-1">' +
            '<h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">' +
            '<span>' + meta.icon + '</span><span>' + escapeHTML(meta.label) + '</span>' +
            '</h2>' +
            '<span class="text-xs font-semibold text-slate-500 bg-slate-200/70 px-2 py-0.5 rounded-full">' +
            list.length + ' Sorte(n) • ' + totalQty + ' Stk.' +
            '</span>' +
            '</div>';
          for (var m = 0; m < list.length; m++) {
            groupedHTML += renderItemCardHTML(list[m], false);
          }
          groupedHTML += '</div>';
        }
        listContainer.innerHTML = groupedHTML;
      } else {
        var flatHTML = '';
        for (var j = 0; j < filtered.length; j++) {
          flatHTML += renderItemCardHTML(filtered[j], true);
        }
        listContainer.innerHTML = flatHTML;
      }
    }

    function createFilterChipHTML(id, label, icon, active) {
      var cls = active
        ? 'bg-slate-900 text-white shadow-xs'
        : 'bg-slate-100 text-slate-700 active:bg-slate-200';
      return '<button type="button" onclick="selectCategoryFilter(\'' + id + '\')" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap flex items-center gap-1 ' + cls + '">' +
        '<span>' + icon + '</span><span>' + escapeHTML(label) + '</span></button>';
    }

    function renderItemCardHTML(item, showCategoryBadge) {
      var status = getItemStatus(item);
      var days = getDaysUntil(item.expiryDate);
      var cat = getCategoryMeta(item.category);

      var badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-200';
      var badgeText = 'MHD ' + formatDateDE(item.expiryDate) + ' (' + days + 'T)';
      var borderClass = 'border-slate-200';

      if (status === 'expired') {
        badgeClass = 'bg-rose-100 text-rose-800 border-rose-200 font-bold';
        badgeText = 'Abgelaufen seit ' + Math.abs(days) + 'T (' + formatDateDE(item.expiryDate) + ')';
        borderClass = 'border-rose-300 bg-rose-50/30';
      } else if (status === 'soon') {
        badgeClass = 'bg-amber-100 text-amber-900 border-amber-200 font-semibold';
        badgeText = days === 0 ? 'Läuft heute ab!' : 'In ' + days + 'T fällig (' + formatDateDE(item.expiryDate) + ')';
        borderClass = 'border-amber-300 bg-amber-50/20';
      }

      var safeId = escapeHTML(item.id);
      return (
        '<div class="bg-white rounded-2xl border ' + borderClass + ' p-3.5 flex flex-col gap-2.5">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="min-w-0">' +
              '<div class="flex items-center gap-1.5 flex-wrap">' +
                (showCategoryBadge ? '<span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">' + cat.icon + ' ' + escapeHTML(cat.label) + '</span>' : '') +
                '<span class="text-xs px-2 py-0.5 rounded-md border ' + badgeClass + '">' + escapeHTML(badgeText) + '</span>' +
              '</div>' +
              '<h3 class="font-bold text-slate-900 text-base mt-1 truncate">' + escapeHTML(item.name) + '</h3>' +
              '<p class="text-xs text-slate-600 truncate">' +
                (item.brand ? escapeHTML(item.brand) : '<span class="italic text-slate-400">Keine Marke/Sorte angegeben</span>') +
                (item.notes ? ' • <span class="text-slate-500">' + escapeHTML(item.notes) + '</span>' : '') +
              '</p>' +
            '</div>' +
            '<div class="text-right shrink-0">' +
              '<span class="inline-flex items-center justify-center bg-slate-100 text-slate-900 font-bold text-sm px-2.5 py-1 rounded-xl">' + item.quantity + '×</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">' +
            '<div class="flex items-center gap-1.5">' +
              '<button onclick="handleItemAction(\'consume-one\', \'' + safeId + '\')" type="button" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-emerald-50 active:bg-emerald-100 text-emerald-800 border border-emerald-200">✓ 1 verbraucht</button>' +
              '<button onclick="handleItemAction(\'restock-variety\', \'' + safeId + '\')" type="button" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-50 active:bg-slate-100 text-slate-700 border border-slate-200">＋ Sorte</button>' +
            '</div>' +
            '<div class="flex items-center gap-1">' +
              '<button onclick="handleItemAction(\'edit\', \'' + safeId + '\')" type="button" class="text-xs font-medium px-2.5 py-1.5 rounded-lg text-slate-600 active:bg-slate-100">Bearbeiten</button>' +
              '<button onclick="handleItemAction(\'delete\', \'' + safeId + '\')" type="button" aria-label="Löschen" class="text-xs font-medium px-2 py-1.5 rounded-lg text-rose-600 active:bg-rose-50">🗑️</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    function handleItemAction(action, id) {
      var idx = -1;
      for (var i = 0; i < state.items.length; i++) {
        if (state.items[i].id === id) {
          idx = i;
          break;
        }
      }
      if (idx === -1) return;
      var item = state.items[idx];

      if (action === 'consume-one') {
        if (item.quantity > 1) {
          item.quantity -= 1;
        } else {
          state.items.splice(idx, 1);
        }
        persist();
        render();
      } else if (action === 'delete') {
        state.items.splice(idx, 1);
        persist();
        render();
      } else if (action === 'edit') {
        openItemModal({ mode: 'edit', item: item });
      } else if (action === 'restock-variety') {
        openItemModal({
          mode: 'new',
          prefill: {
            category: item.category,
            name: item.name,
            brand: item.brand,
            notes: item.notes,
            barcode: item.barcode,
            quantity: 1,
            expiryDate: daysFromNowISO(60)
          }
        });
      }
    }

    function populateCategorySelect(selectedId) {
      var select = document.getElementById('item-category');
      select.innerHTML = '';
      for (var i = 0; i < CATEGORIES.length; i++) {
        var c = CATEGORIES[i];
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.icon + ' ' + c.label;
        if (c.id === selectedId) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function openItemModal(opts) {
      opts = opts || {};
      var mode = opts.mode || 'new';
      var item = opts.item || null;
      var prefill = opts.prefill || null;

      var modal = document.getElementById('modal-item');
      var title = document.getElementById('modal-item-title');
      var defaultCat = activeCategory !== 'all' ? activeCategory : 'nudeln-reis';

      if (mode === 'edit' && item) {
        title.textContent = 'Eintrag bearbeiten';
        document.getElementById('item-id').value = item.id;
        document.getElementById('item-barcode').value = item.barcode || '';
        populateCategorySelect(item.category);
        document.getElementById('item-expiry').value = item.expiryDate;
        document.getElementById('item-name').value = item.name;
        document.getElementById('item-brand').value = item.brand || '';
        document.getElementById('item-quantity').value = String(item.quantity);
        document.getElementById('item-notes').value = item.notes || '';
        populatePresetDropdown(item.category);
      } else {
        title.textContent = 'Produkt einlagern';
        document.getElementById('item-id').value = '';
        document.getElementById('item-barcode').value = (prefill && prefill.barcode) || '';
        var catToUse = (prefill && prefill.category) || defaultCat;
        populateCategorySelect(catToUse);
        document.getElementById('item-expiry').value = (prefill && prefill.expiryDate) || daysFromNowISO(30);
        document.getElementById('item-name').value = (prefill && prefill.name) || '';
        document.getElementById('item-brand').value = (prefill && prefill.brand) || '';
        document.getElementById('item-quantity').value = String((prefill && prefill.quantity) || 1);
        document.getElementById('item-notes').value = (prefill && prefill.notes) || '';
        populatePresetDropdown(catToUse);
      }

      document.getElementById('preset-select').value = '';
      modal.classList.remove('hidden');
    }

    function closeItemModal() {
      stopScanner();
      document.getElementById('modal-item').classList.add('hidden');
    }

    function submitItemForm(e) {
      e.preventDefault();
      var idVal = document.getElementById('item-id').value;
      var record = {
        id: idVal || 'item-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        category: document.getElementById('item-category').value,
        expiryDate: document.getElementById('item-expiry').value,
        name: document.getElementById('item-name').value.trim(),
        brand: document.getElementById('item-brand').value.trim(),
        quantity: Math.max(1, parseInt(document.getElementById('item-quantity').value, 10) || 1),
        notes: document.getElementById('item-notes').value.trim(),
        barcode: document.getElementById('item-barcode').value.trim()
      };

      if (!record.name || !record.expiryDate) return;

      if (idVal) {
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === idVal) {
            state.items[i] = record;
            break;
          }
        }
      } else {
        state.items.push(record);
      }

      persist();
      CalendarReminderHook.onItemSaved(record);
      closeItemModal();
      render();
    }

    function toggleScanner() {
      if (isScanning) stopScanner();
      else startScanner();
    }

    function startScanner() {
      var readerEl = document.getElementById('qr-reader');
      var statusEl = document.getElementById('scanner-status');
      var btn = document.getElementById('btn-toggle-scanner');

      if (typeof Html5Qrcode === 'undefined') {
        statusEl.textContent = 'Scanner-Modul lädt noch oder ist offline. Bitte manuell eintragen.';
        return;
      }

      readerEl.classList.remove('hidden');
      btn.textContent = 'Stoppen';
      statusEl.textContent = 'Kamera wird gestartet... Bitte Zugriff erlauben.';

      try {
        html5QrCode = new Html5Qrcode('qr-reader');
        isScanning = true;
        html5QrCode
          .start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 240, height: 140 } },
            function (decodedText) {
              stopScanner();
              lookupBarcode(decodedText);
            },
            function () {}
          )
          .then(function () {
            statusEl.textContent = 'Halte den Barcode in den Rahmen...';
          })
          .catch(function () {
            isScanning = false;
            readerEl.classList.add('hidden');
            btn.textContent = 'Kamera starten';
            statusEl.textContent = 'Kamera nicht verfügbar (benötigt HTTPS & Kamera-Freigabe). Manuelle Eingabe möglich.';
          });
      } catch (err) {
        isScanning = false;
        readerEl.classList.add('hidden');
        btn.textContent = 'Kamera starten';
        statusEl.textContent = 'Kamera konnte nicht gestartet werden.';
      }
    }

    function stopScanner() {
      var btn = document.getElementById('btn-toggle-scanner');
      var readerEl = document.getElementById('qr-reader');
      if (html5QrCode && isScanning) {
        try {
          html5QrCode.stop().then(function () {
            html5QrCode.clear();
          }).catch(function () {});
        } catch (e) {}
      }
      isScanning = false;
      html5QrCode = null;
      readerEl.classList.add('hidden');
      btn.textContent = 'Kamera starten';
    }

    function lookupBarcode(code) {
      var statusEl = document.getElementById('scanner-status');
      document.getElementById('item-barcode').value = code;
      statusEl.textContent = 'Barcode ' + code + ' erkannt – suche Produktdaten...';

      fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.status === 1 && data.product) {
            var p = data.product;
            var productName = p.product_name_de || p.product_name || '';
            var brands = p.brands || '';
            var qtyText = p.quantity || '';
            var combinedBrand = [brands, qtyText].filter(Boolean).join(' • ');

            if (productName) document.getElementById('item-name').value = productName;
            if (combinedBrand) document.getElementById('item-brand').value = combinedBrand;

            var cats = (p.categories_tags || []).join(' ').toLowerCase();
            if (cats.indexOf('pasta') !== -1 || cats.indexOf('noodle') !== -1 || cats.indexOf('rice') !== -1) {
              document.getElementById('item-category').value = 'nudeln-reis';
            } else if (cats.indexOf('herb') !== -1 || cats.indexOf('spice') !== -1 || cats.indexOf('condiment') !== -1) {
              document.getElementById('item-category').value = 'kraeuter-gewuerze';
            } else if (cats.indexOf('canned') !== -1 || cats.indexOf('tomato') !== -1) {
              document.getElementById('item-category').value = 'konserven';
            } else if (cats.indexOf('sauce') !== -1 || cats.indexOf('oil') !== -1) {
              document.getElementById('item-category').value = 'sossen-oele';
            } else if (cats.indexOf('beverage') !== -1 || cats.indexOf('drink') !== -1 || cats.indexOf('water') !== -1 || cats.indexOf('juice') !== -1) {
              document.getElementById('item-category').value = 'getraenke';
            } else if (cats.indexOf('chocolate') !== -1 || cats.indexOf('sweet') !== -1 || cats.indexOf('snack') !== -1) {
              document.getElementById('item-category').value = 'suesse-snacks';
            }
            populatePresetDropdown(document.getElementById('item-category').value);
            statusEl.textContent = 'Gefunden: ' + (productName || 'Produkt') + ' (' + code + '). Bitte MHD prüfen & speichern.';
          } else {
            statusEl.textContent = 'Barcode ' + code + ' nicht in Open Food Facts gefunden – bitte Name & MHD eintragen.';
          }
        })
        .catch(function () {
          statusEl.textContent = 'Barcode ' + code + ' gespeichert. Bitte Name & MHD manuell eintragen.';
        });
    }

    function openSettingsModal() {
      document.getElementById('warning-days-input').value = String(state.settings.warningDays || 7);
      document.getElementById('modal-settings').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('modal-settings').classList.add('hidden');
    }

    function saveSettings() {
      var days = Math.max(1, Math.min(90, parseInt(document.getElementById('warning-days-input').value, 10) || 7));
      state.settings.warningDays = days;
      persist();
      closeSettingsModal();
      render();
    }

    function clearAllData() {
      state = createDefaultState();
      persist();
      closeSettingsModal();
      render();
    }

    function exportBackupJSON() {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'vorrats-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result));
          if (parsed && Array.isArray(parsed.items)) {
            state = {
              settings: Object.assign({}, createDefaultState().settings, parsed.settings || {}),
              items: parsed.items
            };
            persist();
            closeSettingsModal();
            render();
          }
        } catch (err) {
          alert('Ungültige Backup-Datei.');
        }
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
